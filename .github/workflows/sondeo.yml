name: Sondear un origen

# Antes de escribir un scraper para un sitio, preguntarle si nos deja entrar.
# Descubrirlo despues cuesta horas; esto cuesta un minuto.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espacios (vacio = las candidatas del script)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  sondear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Sondear
        env:
          URLS: ${{ inputs.urls }}
        run: |
          set -euo pipefail
          {
            echo "## Sondeo de origenes"
            echo
            echo '```'
            python -m herramientas.sondeo $URLS 2>&1 | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
